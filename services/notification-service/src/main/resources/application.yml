server:
  port: 8083

spring:
  application:
    name: notification-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.eztask.task.dto.event,com.eztask.notification.dto.event,*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.eztask.notification.dto.event.TaskEventPayload

# JWT Configuration (Uses identical shared secret with identity-service)
app:
  jwt:
    secret: ${JWT_SECRET:EzTaskEnterpriseJwtSecretKeyForSpringCloudGatewayVerification2026!}

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Actuator & Logging
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
logging:
  level:
    com.eztask.notification: INFO
    org.springframework.kafka: INFO
    org.springframework.web.socket: INFO
