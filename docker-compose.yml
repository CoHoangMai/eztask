services:
  # ============================================================================
  # 1. DATABASES LAYER (Polyglot Persistence)
  # ============================================================================

  # PostgreSQL for Identity Service (ACID compliance for Users & Roles)
  postgres-identity:
    image: postgres:16-alpine
    container_name: eztask-postgres-identity
    restart: unless-stopped
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_identity_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - eztask-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d identity_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB for Task Management Service (Flexible Document model for Kanban boards & cards)
  mongo-task:
    image: mongo:7.0
    container_name: eztask-mongo-task
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: mongopassword
      MONGO_INITDB_DATABASE: task_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_task_data:/data/db
    networks:
      - eztask-network
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh mongodb://mongoadmin:mongopassword@localhost:27017/admin --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Redis for Notification Caching, Rate Limiting & User Session State
  redis-cache:
    image: redis:7.2-alpine
    container_name: eztask-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - eztask-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. MESSAGE BROKER LAYER (Event-Driven Architecture)
  # ============================================================================

  # Apache Kafka in KRaft mode (No Zookeeper dependency required - Modern Spring Boot 3 standard)
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: eztask-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - eztask-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5

  # Kafka UI for inspecting topics, partitions, and real-time events during interview demos
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: eztask-kafka-ui
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-eztask-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - eztask-network

  # ============================================================================
  # 3. MICROSERVICES BACKEND
  # ============================================================================

  # Frontend Client (React 18 + Vite + Tailwind: Port 3000)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eztask-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - eztask-network

  # API Gateway (Spring Cloud Gateway: Port 8080)
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: eztask-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      IDENTITY_SERVICE_URL: http://identity-service:8081
      TASK_SERVICE_URL: http://task-service:8082
      NOTIFICATION_SERVICE_URL: http://notification-service:8083
      WS_NOTIFICATION_SERVICE_URL: ws://notification-service:8083
      REDIS_HOST: redis-cache
      REDIS_PORT: 6379
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      JWT_SECRET: EzTaskEnterpriseJwtSecretKeyForSpringCloudGatewayVerification2026!
    depends_on:
      - redis-cache
      - zipkin
    networks:
      - eztask-network

  # Identity Service (Spring Boot 3 + PostgreSQL: Port 8081)
  identity-service:
    build:
      context: ./services/identity-service
      dockerfile: Dockerfile
    container_name: eztask-identity-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-identity:5432/identity_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      JWT_SECRET: EzTaskEnterpriseJwtSecretKeyForSpringCloudGatewayVerification2026!
      JWT_EXPIRATION_MS: 86400000
    depends_on:
      postgres-identity:
        condition: service_healthy
      zipkin:
        condition: service_started
    networks:
      - eztask-network

  # Task Service (Spring Boot 3 + MongoDB + Kafka Producer: Port 8082)
  task-service:
    build:
      context: ./services/task-service
      dockerfile: Dockerfile
    container_name: eztask-task-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_MONGODB_URI: mongodb://mongoadmin:mongopassword@mongo-task:27017/task_db?authSource=admin
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      mongo-task:
        condition: service_healthy
      kafka:
        condition: service_healthy
      zipkin:
        condition: service_started
    networks:
      - eztask-network

  # Notification Service (Spring Boot 3 Worker + Kafka Consumer + Redis: Port 8083)
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: eztask-notification-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis-cache
      REDIS_PORT: 6379
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      kafka:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      zipkin:
        condition: service_started
    networks:
      - eztask-network

  # ============================================================================
  # 4. OBSERVABILITY & DISTRIBUTED TRACING (Zipkin, Prometheus & Grafana)
  # ============================================================================
  zipkin:
    image: openzipkin/zipkin:3.0.6
    container_name: eztask-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    networks:
      - eztask-network

  prometheus:
    image: prom/prometheus:v2.50.1
    platform: linux/amd64
    container_name: eztask-prometheus
    restart: unless-stopped
    user: "0:0"
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - eztask-network

  grafana:
    image: grafana/grafana:10.3.3
    platform: linux/amd64
    container_name: eztask-grafana
    restart: unless-stopped
    user: "0:0"
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infrastructure/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/monitoring/grafana/provisioning/dashboards/eztask-overview.json:/var/lib/grafana/dashboards/eztask-overview.json:ro
    depends_on:
      - prometheus
    networks:
      - eztask-network

networks:
  eztask-network:
    driver: bridge

volumes:
  postgres_identity_data:
  mongo_task_data:
  redis_data:
  kafka_data:
  grafana_data:
